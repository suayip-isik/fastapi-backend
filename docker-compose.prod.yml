services:
  # Production override — docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

  api:
    build:
      target: production
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    environment:
      - APP_ENV=production
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - RATE_LIMIT_ENABLED=true
    # Production'da kod mount edilmez
    volumes: []

  worker:
    build:
      target: production
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes: []

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - app_network

  db:
    restart: always
    # Production'da port dışarı açılmaz
    ports: []

  redis:
    restart: always
    ports: []

  minio:
    restart: always
    # Production'da S3 kullanılıyor; MinIO'yu devre dışı bırakmak için
    # docker-compose.prod.yml'de profiles: [dev] eklenebilir
    ports: []

volumes:
  nginx_certs:
