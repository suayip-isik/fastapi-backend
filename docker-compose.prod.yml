services:
  # Production override — docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

  api:
    build:
      target: production
    restart: always
    environment:
      - APP_ENV=production
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - RATE_LIMIT_ENABLED=true
      - DOCS_ACCESS_MODE=internal
      - METRICS_ACCESS_MODE=internal
      - HEALTH_DETAIL_ACCESS_MODE=internal
      - SEED_DEFAULT_SUPERADMIN=false
      - SEED_DEFAULT_APP_USER=false
    # Production'da kod mount edilmez
    volumes: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      target: production
    restart: always
    volumes: []

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - app_network

  db:
    restart: always
    # Production'da port dışarı açılmaz
    ports: []

  redis:
    restart: always
    ports: []

  minio:
    restart: always
    # Self-hosted object storage kullanıyorsanız bırakın; managed S3 için
    # bu servisi compose setinizden çıkarabilirsiniz.
    ports: []

volumes:
  nginx_certs:
