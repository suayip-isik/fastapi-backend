worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":"$status",'
        '"body_bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream":"$upstream_response_time",'
        '"ip":"$remote_addr",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Security ──────────────────────────────────────────────────────────────
    server_tokens off;
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # ── Rate Limiting (nginx level) ───────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream fastapi {
        # Docker Compose scale ile birden fazla API container'ı
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Proxy Settings ────────────────────────────────────────────────────
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # ── Health Check (no rate limit) ──────────────────────────────────────
        location /health {
            proxy_pass http://fastapi;
        }

        # ── Auth endpoints (strict rate limit) ───────────────────────────────
        location ~ ^/api/v1/auth/(login|register|forgot-password) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://fastapi;
        }

        # ── WebSocket ─────────────────────────────────────────────────────────
        location /api/v1/ws/ {
            proxy_pass http://fastapi;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── General API ───────────────────────────────────────────────────────
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://fastapi;
            proxy_read_timeout 30s;
        }
    }
}
